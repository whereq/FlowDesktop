name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — tests, evals, lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The two local packages are path dependencies inside this repository —
      # there is no private index and nothing to fetch over SSH.
      - name: Install dependencies
        run: |
          uv venv
          uv sync --frozen --extra dev

      - name: Unit tests
        run: uv run python -m pytest -q --no-cov

      # The router evals are pure/deterministic — no database, no LLM.
      - name: Router evals
        run: uv run python evals/run_evals.py

      - name: Lint
        run: |
          uv run ruff check api worker flowdesk evals tests packages scripts
          uv run ruff format --check api worker flowdesk evals tests packages scripts

  schema:
    name: Schema — migrations vs models
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A static comparison — no database and no pgvector needed, so it can
      # never be skipped for a missing service.
      - name: Install dependencies
        run: |
          uv venv
          uv sync --frozen --extra dev

      - name: Check the migrations against the models
        run: uv run python scripts/check_schema.py

  docker:
    name: Docker — the images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The image build is its own gate: the runtime image is assembled from
      # the lockfile, and a dependency that is only an optional extra (or a
      # library the image forgot to install) breaks the build in a way no
      # unit test would catch.
      - name: Build the API image
        run: docker build -f docker/api/Dockerfile -t flowdesktop-api:ci .

      - name: Build the frontend image
        run: docker build -f docker/frontend/Dockerfile -t flowdesktop-frontend:ci .

      - name: Validate the compose stack
        run: |
          cp docker/.env.example docker/.env
          docker compose -f docker/docker-compose.yml config -q

  frontend:
    name: Frontend — lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Build
        run: yarn build
