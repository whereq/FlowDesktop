[project]
name = "flowdesktop-backend"
version = "0.1.0"
description = "FlowDesktop — AI stock analysis, agent schedules and a paper-trading simulator."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "FlowDesktop contributors" }]
keywords = ["stocks", "finance", "ai", "agent", "paper-trading", "fastapi"]

dependencies = [
    # Web framework
    "fastapi>=0.135.2",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    # The shared data core and the market-data access layer. Both live in this
    # repository under backend/packages/ and are installed as local path
    # dependencies — there is nothing to fetch over the network.
    "flowdesk-core",
    "flowdesk-collector",
    # Database
    "sqlalchemy[asyncio]>=2.0.48",
    "asyncpg>=0.31.0",
    "psycopg2-binary>=2.9.11",
    "alembic>=1.18.4",
    # LLM gateway
    "litellm>=1.0.0",
    # Auth
    "python-jose[cryptography]>=3.5.0",
    # Web Push (VAPID)
    "pywebpush>=2.0.3",
    # Payments
    "stripe>=10.0.0",
    # Utilities
    "python-dotenv>=1.2.2",
    "httpx>=0.28.1",
    "aiohttp>=3.13.4",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "pyright>=1.1.370",
    "pre-commit>=4.0.0",
    "ipython>=9.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The importable packages of the application layer. The shared data core and
# the collector are separate distributions under backend/packages/.
[tool.hatch.build.targets.wheel]
packages = ["api", "flowdesk", "worker"]

[tool.uv.sources]
# Both packages are part of this repository. They are installed in editable
# mode so a change under packages/ takes effect without a re-install.
flowdesk-core = { path = "packages/flowdesk-core", editable = true }
flowdesk-collector = { path = "packages/flowdesk-collector", editable = true }

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
]
# "ARG" (unused-arguments) is deliberately not enabled: FastAPI dependency
# parameters are injected by name and are legitimately "unused" in the body.
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B904",   # raise without from inside except
    "SIM105", # contextlib.suppress is slower than try/except pass
]

[tool.ruff.lint.isort]
known-first-party = ["flowdesk", "api", "flowdesk_core", "flowdesk_collector"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=flowdesk --cov=api"

[tool.coverage.run]
source = ["flowdesk", "api"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
