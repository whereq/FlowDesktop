[project]
name = "flowdesk-collector"
version = "0.1.0"
description = "Data sync for FlowDesktop — scheduled jobs that pull market data from the whereq.cloud Data API."
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "FlowDesktop contributors" }]

dependencies = [
    "flowdesk-core",
    # Scheduling
    "apscheduler>=3.11.2",
    # The Data API client. The key itself is configured by the operator
    # (WHEREQ_API_KEY) and is never bundled.
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# Local ONNX embedding model for the filing retrieval index.
embeddings = ["fastembed>=0.3.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# The collector modules live at flowdesk_collector/ inside this project, which
# is the conventional layout — setuptools finds them and their subpackages
# automatically.
[tool.setuptools.packages.find]
include = ["flowdesk_collector*"]
